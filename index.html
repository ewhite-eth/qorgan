<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qorǵan Clinic Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#0B1530; --muted:#3A4560; --line:#9AA5BD;
  --brand:#14235A; --brand-ink:#FFFFFF; --focus:#B45309;
  --ok:#0B6B3A; --ok-bg:#DDF2E6; --warn:#7A4100; --warn-bg:#FCEBD0; --bad:#9B111E; --bad-bg:#FADADD;
  --info:#123E8C; --info-bg:#DCE7FA; --sample:#5B2A86; --sample-bg:#EDE2F7;
  --fs:18px; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --surface:#161D33; --ink:#F3F6FF; --muted:#C9D1E6; --line:#56607C;
    --brand:#9DB4FF; --brand-ink:#0B1020; --focus:#FFB45C;
    --ok:#7FE0A8; --ok-bg:#103A26; --warn:#FFC77A; --warn-bg:#3E2A0C; --bad:#FF9BA4; --bad-bg:#45141B;
    --info:#A9C4FF; --info-bg:#162B55; --sample:#D8B8FF; --sample-bg:#33204A;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#161D33; --ink:#F3F6FF; --muted:#C9D1E6; --line:#56607C;
  --brand:#9DB4FF; --brand-ink:#0B1020; --focus:#FFB45C;
  --ok:#7FE0A8; --ok-bg:#103A26; --warn:#FFC77A; --warn-bg:#3E2A0C; --bad:#FF9BA4; --bad-bg:#45141B;
  --info:#A9C4FF; --info-bg:#162B55; --sample:#D8B8FF; --sample-bg:#33204A;
}
:root.big{--fs:23px}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{background:var(--brand);color:var(--brand-ink)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
.logo{font-weight:800;font-size:1.35rem;letter-spacing:.01em;margin-right:auto}
.logo small{display:block;font-weight:600;font-size:.8rem;opacity:.95}
.tbtn{background:transparent;border:2px solid currentColor;color:inherit;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;min-height:44px}
.tbtn[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand)}
nav.tabs{background:var(--surface);border-bottom:2px solid var(--line)}
nav.tabs .wrap{display:flex;flex-wrap:wrap;gap:4px;padding-top:6px;padding-bottom:0}
nav.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:4px solid transparent;cursor:pointer;min-height:44px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
main{padding:20px 0 60px}
h1{font-size:1.7rem;margin:.2em 0 .4em;line-height:1.2}
h2{font-size:1.3rem;margin:1.2em 0 .5em}
h3{font-size:1.08rem;margin:.8em 0 .3em}
p{margin:.4em 0}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.role{display:block;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;min-height:44px}
.role:hover,.role:focus-visible{border-color:var(--brand)}
.role strong{display:block;font-size:1.15rem}
.role span{color:var(--muted)}
label{display:block;font-weight:700;margin:14px 0 6px}
.hint{color:var(--muted);font-size:.92rem;font-weight:400}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--surface);min-height:44px}
textarea{min-height:90px;resize:vertical}
fieldset{border:0;padding:0;margin:14px 0 0}
legend{font-weight:700;margin-bottom:6px;padding:0}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice span{display:inline-block;border:2px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--surface);min-height:44px;line-height:1.5}
.choice input:checked+span{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.choice input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{background:var(--brand);color:var(--brand-ink);border:2px solid var(--brand);border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;min-height:44px}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.err{color:var(--bad);font-weight:700;margin-top:6px}
.notice{border-radius:8px;padding:10px 14px;font-weight:600;margin:0 0 14px;border:2px solid}
.n-info{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.n-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.n-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.n-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.n-sample{background:var(--sample-bg);color:var(--sample);border-color:var(--sample)}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-weight:700;font-size:.9rem;border:2px solid}
.s-new{background:var(--bad-bg);color:var(--bad)}
.s-ack{background:var(--warn-bg);color:var(--warn)}
.s-vendor{background:var(--info-bg);color:var(--info)}
.s-restored{background:var(--ok-bg);color:var(--ok)}
.s-closed{background:var(--surface);color:var(--muted)}
.p-rec{background:var(--warn-bg);color:var(--warn)}
.p-sample{background:var(--sample-bg);color:var(--sample)}
.ticket h3{margin-top:0}
.meta{color:var(--muted);font-size:.95rem}
ol.tl{list-style:none;padding:0;margin:10px 0}
ol.tl li{border-left:4px solid var(--line);padding:2px 0 8px 12px;margin-left:6px}
ol.tl li.done{border-left-color:var(--ok)}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi .v{font-size:2.1rem;font-weight:800;line-height:1.1}
.kpi .l{font-weight:700}
.kpi .t{color:var(--muted);font-size:.9rem}
.kpi.good{border-color:var(--ok)} .kpi.good .v{color:var(--ok)}
.kpi.miss{border-color:var(--bad)} .kpi.miss .v{color:var(--bad)}
.bar{display:grid;grid-template-columns:minmax(120px,1fr) 3fr auto;gap:10px;align-items:center;margin:6px 0}
.bar .track{height:22px;background:var(--bg);border:2px solid var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--brand)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;border-bottom:2px solid var(--line);padding:8px 6px;vertical-align:top}
th{font-size:.92rem}
.tablewrap{overflow-x:auto}
.check{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.check input{width:26px;height:26px;flex:none;margin-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.task{border:2px solid var(--line);border-radius:8px;padding:12px;margin:10px 0}
.task .row{margin-top:8px}
.counter{display:inline-flex;align-items:center;gap:6px}
.counter button{width:44px}
.footer{color:var(--muted);font-size:.9rem;margin-top:24px}
[hidden]{display:none!important}
@media print{
  header.top,nav.tabs,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card,.kpi{break-inside:avoid;border-color:#000}
}
@media (max-width:560px){h1{font-size:1.4rem}.kpi .v{font-size:1.7rem}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo">Qorǵan Clinic Desk<small data-i18n="tagline"></small></div>
    <button class="tbtn" id="langBtn" type="button" aria-label="Language"></button>
    <button class="tbtn" id="bigBtn" type="button" aria-pressed="false" data-i18n="bigText"></button>
    <button class="tbtn" id="roleBtn" type="button" hidden data-i18n="nav.switch"></button>
  </div>

<main class="wrap">
  <div id="modeNote" aria-live="polite"></div>
  <div id="live" class="sr" aria-live="assertive"></div>
  <div id="view"></div>
  <p class="footer" data-i18n="footer"></p>
</main>

    if(k==="class")el.className=v;else if(k==="text")el.textContent=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else el.setAttribute(k,v===true?"":v)}

const COLS=["tickets","vendors","meta","tests"];
const Store={mode:"local",data:{tickets:{},vendors:{},meta:{},tests:{}},db:null,switched:false,bc:null,
  loadLocal(){try{const raw=ls.get("qorgan_mvp_v2");if(raw){const d=JSON.parse(raw);for(const c of COLS)this.data[c]=d[c]||{}}}catch(e){}},
  saveLocal(){ls.set("qorgan_mvp_v2",JSON.stringify(this.data));try{this.bc&&this.bc.postMessage("changed")}catch(e){}},
  async init(){
    this.loadLocal();
    try{this.bc=new BroadcastChannel("qorgan_mvp");this.bc.onmessage=()=>{if(this.mode==="local"){this.loadLocal();render()}}}catch(e){}
    window.addEventListener("storage",e=>{if(e.key==="qorgan_mvp_v2"&&this.mode==="local"){this.loadLocal();render()}});
    if(CLOUD.url&&CLOUD.key&&await this.initCloud())return;
    if(!(window.claude&&typeof window.claude.use==="function"))return;
    let db=null,user=null;
    try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){db=null}
    if(!db)return;
    let canWrite=null;try{canWrite=user?await user.can("data.write"):null}catch(e){}
    if(canWrite===false)return;
    this.db=db;this.mode="shared";const fresh={};
    for(const c of COLS){this.data[c]={};
      db.collection(c).onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});this.data[c]=o;render()},()=>{this.fallback()})}
    render();
  },
  async initCloud(){
    try{
      if(!window.supabase){await new Promise((ok,bad)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js";sc.onload=ok;sc.onerror=bad;document.head.append(sc)})}
      const sb=window.supabase.createClient(CLOUD.url,CLOUD.key,{auth:{persistSession:false}});
      this.connecting=true;render();
      const {data,error}=await Promise.race([sb.from("docs").select("col,id,data"),new Promise((_,bad)=>setTimeout(()=>bad(new Error("timeout")),8000))]);this.connecting=false;if(error)throw error;
      const fresh={tickets:{},vendors:{},meta:{},tests:{}};
      (data||[]).forEach(r=>{if(fresh[r.col])fresh[r.col][r.id]=r.data});
      this.data=fresh;this.sb=sb;this.mode="shared";this.cloud=true;
      const apply=pl=>{const n=pl.new&&pl.new.col?pl.new:null,o=pl.old&&pl.old.col?pl.old:null;
        if(pl.eventType==="DELETE"&&o&&this.data[o.col]){delete this.data[o.col][o.id]}
        else if(n&&this.data[n.col]){this.data[n.col][n.id]=n.data}render()};
      sb.channel("qorgan_docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},apply).subscribe(st=>{this.live=st==="SUBSCRIBED"});
      setInterval(()=>{if(!this.live)this.refreshCloud()},8000);
      render();return true;
    }catch(e){this.connecting=false;this.cloudFailed=true;return false}
  },
  async refreshCloud(){try{const {data,error}=await this.sb.from("docs").select("col,id,data");if(error)return;const f={tickets:{},vendors:{},meta:{},tests:{}};(data||[]).forEach(r=>{if(f[r.col])f[r.col][r.id]=r.data});this.data=f;render()}catch(e){}},
  fallback(){if(this.mode!=="local"){this.mode="local";this.switched=true;this.db=null;this.loadLocal();render()}},
  async put(col,id,obj){
    if(this.cloud){const {error}=await this.sb.from("docs").upsert({col,id,data:obj,updated_at:new Date().toISOString()});if(error)throw error;this.data[col][id]=obj;render();return}
    if(this.mode==="shared"){try{await this.db.collection(col).doc(id).set(obj);return}catch(e){
      if(e&&["not_granted","capability_disabled","capability_removed","revoked"].includes(e.code)){const snap=JSON.parse(JSON.stringify(this.data));this.fallback();for(const c of COLS)this.data[c]=Object.assign({},snap[c],this.data[c]);}else throw e}}
    this.data[col][id]=obj;this.saveLocal();render()},
  async del(col,id){
    if(this.cloud){const {error}=await this.sb.from("docs").delete().eq("col",col).eq("id",id);if(error)throw error;delete this.data[col][id];render();return}
    if(this.mode==="shared"){try{await this.db.collection(col).doc(id).delete();return}catch(e){this.fallback()}}
    delete this.data[col][id];this.saveLocal();render()},
  list(col){return Object.entries(this.data[col]).map(([id,v])=>Object.assign({id},v))}
};

  const lb=document.getElementById("langBtn");lb.textContent=t("langSwitch");lb.setAttribute("aria-label",lang==="kk"?"Switch to English":"Қазақ тіліне ауысу");

  for(let i=1;i<=10;i++){const id="chk"+i;cc.append(h("label",{class:"check",for:id,style:"font-weight:400"},h("input",{type:"checkbox",id,checked:!!chk[i],onchange:async e=>{await Store.put("meta","clinic_"+S.clinic,Object.assign({},meta,{checklist:Object.assign({},chk,{[i]:e.target.checked})}))}}),t("chk."+i)))}
  box.append(cc);
  const dec=meta.decision||{};const dd={v:dec.v,reason:dec.reason||""};const derr=h("p",{class:"err",role:"alert"});
  const rin=h("input",{id:"decReason",type:"text",maxlength:"200",value:dd.reason,oninput:e=>dd.reason=e.target.value});
  box.append(h("div",{class:"card"},h("h2",{style:"margin-top:0"},t("dec.title")),
    radioGroup("dec",["continue","more","stop"].map(k=>[k,t("dec."+k)]),dd.v,v=>dd.v=v),
    h("label",{for:"decReason"},t("dec.reason")),rin,derr,
    h("div",{class:"row noprint",style:"margin-top:12px"},h("button",{type:"button",class:"btn",onclick:async()=>{if(!dd.v){derr.textContent=t("err.required");return}
      try{await Store.put("meta","clinic_"+S.clinic,Object.assign({},meta,{decision:{v:dd.v,reason:dd.reason.trim(),at:now()}}));announce(t("dec.saved"))}catch(e){derr.textContent=t("err.save")}}},t("dec.save"))),
    dec.at?h("p",{class:"meta"},t("dec.saved")+": "+fmtTime(dec.at)+" · "+t("dec."+dec.v)):null));
  box.append(h("div",{class:"row noprint"},h("button",{type:"button",class:"btn secondary",onclick:()=>window.print()},t("print")),
    h("button",{type:"button",class:"btn secondary",onclick:()=>exportCsv("qorgan_tickets_"+S.clinic+".csv",ticketRows(T))},t("exportTickets"))));
  return box}

function ticketRows(T){const head=["id","clinic","sample","category","scope","patients_waiting","vendor","created","call_back_min","restore_min","status","recurring","reopened","stress_before","stress_after","speed_vs_before"];
  return [head].concat(T.map(x=>[x.id,x.clinic,x.sample?1:0,x.cat,x.scope,x.patients?1:0,x.vendor,new Date(x.createdAt).toISOString(),x.ackAt?mins(x.createdAt,x.ackAt).toFixed(1):"",x.restoredAt?mins(x.createdAt,x.restoredAt).toFixed(1):"",x.status,x.recurring?1:0,x.reopened||0,x.stressBefore||"",x.stressAfter||"",x.speed||""]))}
async function exportCsv(name,rows){
  const csv="﻿"+rows.map(r=>r.map(v=>{const s=String(v??"");return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(",")).join("\r\n");
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:name,data:new Blob([csv],{type:"text/csv"})});return}}}catch(e){if(e&&e.code==="declined")return}
  const a=h("a",{href:URL.createObjectURL(new Blob([csv],{type:"text/csv"})),download:name});document.body.append(a);a.click();a.remove()}

    box.append(h("div",{class:"card"},h("div",{class:"grid g2"},h("div",null,...inp("system",t("v.system"))),h("div",null,...inp("vendor",t("v.vendor"))),h("div",null,...inp("contract",t("v.contract"),"date")),h("div",null,...inp("contact",t("v.contact")))),err,

        try{await Store.put("vendors",newId("V"),{clinic,system:f.system.trim(),vendor:f.vendor.trim(),contract:f.contract||"",contact:(f.contact||"").trim()})}catch(e){err.textContent=t("err.save")}}},t("v.add")))))}

function viewTest(){
  if(!S.testDraft)S.testDraft={code:"",role:"",consent:false,tasks:{},use:"",comment:""};
  const d=S.testDraft;const box=h("div");box.append(h("h1",null,t("role.test")),h("p",null,t("t.lead")));
  if(flashText()){box.append(h("p",{class:"notice n-ok",role:"status"},flashText()))}
  const err=h("p",{class:"err",role:"alert"});
  const code=h("input",{id:"pcode",type:"text",maxlength:"4",placeholder:"P01",value:d.code,oninput:e=>d.code=e.target.value.toUpperCase().trim()});
  const card=h("div",{class:"card"},h("label",{for:"pcode",style:"margin-top:0"},t("t.code")),code,
    h("fieldset",null,h("legend",null,t("t.role")),radioGroup("prole",["admin","director","staff"].map(k=>[k,t("t.r."+k)]),d.role,v=>{d.role=v;render()})),
    h("label",{class:"check",for:"pcons",style:"font-weight:600"},h("input",{type:"checkbox",id:"pcons",checked:d.consent,onchange:e=>d.consent=e.target.checked}),t("t.consent")));
  box.append(card,h("h2",null,t("t.tasks")));
  const SET=TASKSET[d.role]||[];
  if(!SET.length)box.append(h("p",{class:"card"},t("t.pickRole")));
  if(d.role==="director")box.append(h("p",{class:"notice n-warn"},t("t.dirPrep")));
  SET.forEach((k,i)=>{const r=d.tasks[k]||(d.tasks[k]={errors:0});const tc=h("div",{class:"task card"});
    const time=r.start?(r.end?Math.round((r.end-r.start)/1000)+" s":"…"):"";
    tc.append(h("h3",{style:"margin-top:0"},(i+1)+". "+t(k)+" ("+k.toUpperCase()+")"),
      h("div",{class:"row"},h("button",{type:"button",class:"btn secondary",onclick:()=>{r.start=now();r.end=null;r.result=null;render()}},t("t.start")),
        ...["done","help","fail"].map(res=>h("button",{type:"button",class:"btn"+(r.result===res?"":" secondary"),"aria-pressed":String(r.result===res),disabled:!r.start,onclick:()=>{r.end=r.end||now();r.result=res;render()}},t("t."+res))),
        h("strong",null,time)),
      h("div",{class:"row"},h("span",{class:"counter"},t("t.errors")+": ",h("button",{type:"button",class:"btn secondary","aria-label":"−",onclick:()=>{r.errors=Math.max(0,r.errors-1);render()}},"−"),h("strong",null,String(r.errors)),h("button",{type:"button",class:"btn secondary","aria-label":"+",onclick:()=>{r.errors++;render()}},"+")),
        h("span",null,t("t.ease")+": "),radioGroup("ease_"+k,[1,2,3,4,5].map(n=>[n,String(n)]),r.ease,v=>r.ease=Number(v))));
    box.append(tc)});
  const cm=h("textarea",{id:"pcomm",maxlength:"500",oninput:e=>d.comment=e.target.value});cm.value=d.comment;
  box.append(h("div",{class:"card"},h("fieldset",{style:"margin-top:0"},h("legend",null,t(d.role==="director"?"t.pay":"t.use")),radioGroup("puse",[["yes",t("yes")],["maybe",t("maybe")],["no",t("no")]],d.use,v=>d.use=v)),
    h("label",{for:"pcomm"},t("t.comment")),cm,err,
    h("div",{class:"row",style:"margin-top:12px"},h("button",{type:"button",class:"btn",onclick:save},t("t.save")))));
  async function save(){err.textContent="";
    if(!/^P\d{2}$/.test(d.code)){err.textContent=t("err.pcode");code.focus();return}
    if(!d.consent){err.textContent=t("err.consent");return}
    if(!d.role){err.textContent=t("err.required");return}
    if(!SET.some(k=>d.tasks[k]&&d.tasks[k].result)){err.textContent=t("err.tasks");return}
    const rec={code:d.code,role:d.role,at:now(),lang,use:d.use,comment:d.comment.trim().slice(0,500),tasks:{}};
    SET.forEach(k=>{const r=d.tasks[k];if(r&&r.result)rec.tasks[k]={result:r.result,sec:r.end&&r.start?Math.round((r.end-r.start)/1000):null,errors:r.errors,ease:r.ease||null}});
    try{await Store.put("tests",d.code+"-"+now().toString(36),rec);S.testDraft=null;setFlash("t.saved");render()}catch(e){err.textContent=t("err.save")}}
  const recs=Store.list("tests").sort((a,b)=>a.at-b.at);
  box.append(h("h2",null,t("t.list")));
  if(!recs.length)box.append(h("p",{class:"card"},t("t.empty")));
  else{const tb=h("table");tb.append(h("tr",null,[t("t.code"),t("t.role"),...TASKS.map(k=>k.toUpperCase()),t("t.useShort")].map(x=>h("th",null,x))));
    recs.forEach(r=>tb.append(h("tr",null,h("td",null,r.code),h("td",null,t("t.r."+r.role)),...TASKS.map(k=>h("td",null,r.tasks[k]?t("t."+r.tasks[k].result)+(r.tasks[k].sec!=null?" · "+r.tasks[k].sec+" s":""):"—")),h("td",null,r.use?t(r.use):"—"))));
    box.append(h("div",{class:"card tablewrap"},tb))}
  box.append(h("div",{class:"row"},h("button",{type:"button",class:"btn secondary",onclick:()=>{const head=["code","role","date","language"];TASKS.forEach(k=>head.push(k+"_result",k+"_seconds",k+"_errors",k+"_ease"));head.push("would_use_or_pay","comment");
    exportCsv("qorgan_user_tests.csv",[head].concat(recs.map(r=>{const row=[r.code,r.role,new Date(r.at).toISOString(),r.lang];TASKS.forEach(k=>{const x=r.tasks[k]||{};row.push(x.result||"",x.sec??"",x.errors??"",x.ease??"")});row.push(r.use||"",r.comment||"");return row})))}},t("t.export"))));
  return box}
